<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détail patient | MediLab</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page-shell">
    <header class="hero">
        <div>
            <p class="eyebrow">Dossier patient</p>
            <h1 th:text="${patient.firstName() + ' ' + patient.lastName()}"></h1>
            <p class="subtitle">Vue individuelle du patient pour le sprint 1.</p>
        </div>
        <div class="hero-actions">
            <a class="button button-secondary" th:href="@{/patients}">Retour</a>
            <a class="button button-primary" th:href="@{'/patients/' + ${patient.id()} + '/edit'}">Modifier</a>
        </div>
    </header>

    <section th:if="${successMessage}" class="alert alert-success">
        <p th:text="${successMessage}"></p>
    </section>

    <section class="detail-grid">
        <article class="panel detail-card">
            <h2>Informations personnelles</h2>
            <dl>
                <div>
                    <dt>ID</dt>
                    <dd th:text="${patient.id()}"></dd>
                </div>
                <div>
                    <dt>Prénom</dt>
                    <dd th:text="${patient.firstName()}"></dd>
                </div>
                <div>
                    <dt>Nom</dt>
                    <dd th:text="${patient.lastName()}"></dd>
                </div>
                <div>
                    <dt>Date de naissance</dt>
                    <dd th:text="${patient.birthDate()}"></dd>
                </div>
                <div>
                    <dt>Genre</dt>
                    <dd th:text="${patient.gender()}"></dd>
                </div>
                <div>
                    <dt>Adresse</dt>
                    <dd th:text="${patient.address()} ?: '-'"></dd>
                </div>
                <div>
                    <dt>Téléphone</dt>
                    <dd th:text="${patient.phone()} ?: '-'"></dd>
                </div>
            </dl>
        </article>
    </section>
</main>
</body>
</html>
